<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Information System</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2><i class="fas fa-map-marked-alt"></i> Land Information System</h2>

    <button>
        <i class="fas fa-user"></i> Login
    </button>
</header>

<div class="container">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">

        <h3>Layers</h3>

        <button id="parcelsBtn">
            <i class="fas fa-layer-group"></i>
            Parcels
        </button>

        

        <button>
            <i class="fas fa-home"></i>
            Land use 
        </button>

       

        <hr>

        <h3>Search Parcel</h3>

        <input
            type="text"
            id="parcelSearch"
            placeholder="Parcel Number">

        <button id="searchBtn">
            Search
        </button>

    </aside>

    <!-- MAP -->
    <main>

        <div id="toolbar">

            <span>Projection : EPSG:21037</span>

            <span id="coordinates">
                Lat:0.0000 Lon:0.0000
            </span>

        </div>

        <div id="map"></div>

    </main>

    

    </aside>

</div>

<footer>

Land Information System | GeoServer • PostGIS • Leaflet

</footer>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
